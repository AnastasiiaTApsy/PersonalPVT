<h1>Результати</h1>

<div class="col-sm-4">
    <ul class="list-unstyled result-list">
        <li ng-if="trials.length > 1">
            <a ui-sref=".all" ui-sref-active="active">&lt; порівняти всі випробування &gt;</a>
            <p> {{ trials.length }} випробувань протягом {{ getDateSpan(trials) }} днів</p>
        </li>
        <li ng-repeat="(index, trial) in trials.toReversed()">
            <a ui-sref=".trial({ trialId: idForTrial(trial) })" ui-sref-active="active"> {{ titleForTrial(пробна версія) }} </a>
            <p>{{ textForTrial(пробна версія) }}</p>
        </li>
    </ul>
</div>
<div ui-view class="col-sm-8"></div>
